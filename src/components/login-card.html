<div class="w-full max-w-md rounded-[2rem] border border-white/10 bg-[#0f1419]/95 p-10 shadow-[0_25px_100px_rgba(0,0,0,0.25)] backdrop-blur-2xl">
    <div class="mb-8 text-center">
        <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-3xl border border-[#c5bdb1]/30 bg-[#c5bdb1]/10 text-2xl font-bold text-[#c5bdb1]">
        </div>
        <h1 class="text-3xl font-semibold text-white">Bem-vindo de volta</h1>
        <p class="mt-2 text-sm text-[#9ca3af]">Faça login para acessar o painel do Cliente Core.</p>
    </div>

    <form class="space-y-6" aria-describedby="login-help">
        <p id="login-help" class="sr-only">Informe seu e-mail e senha para entrar.</p>
        <div>
            <label for="login-email" class="mb-2 block text-sm font-medium text-[#d1d5db]">E-mail</label>
            <input id="login-email" name="email" type="email" autocomplete="email" placeholder="seu@email.com"
                class="w-full rounded-2xl border border-[#333847] bg-[#121827] px-4 py-3 text-sm text-white outline-none transition focus:border-[#c5bdb1] focus:ring-2 focus:ring-[#c5bdb1]/20" />
        </div>

        <div>
            <label for="login-password" class="mb-2 block text-sm font-medium text-[#d1d5db]">Senha</label>
            <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="••••••••"
                class="w-full rounded-2xl border border-[#333847] bg-[#121827] px-4 py-3 text-sm text-white outline-none transition focus:border-[#c5bdb1] focus:ring-2 focus:ring-[#c5bdb1]/20" />
        </div>

        <div class="flex items-center justify-between text-sm text-[#9ca3af]">
            <label class="flex items-center gap-2">
                <input type="checkbox" name="remember" class="h-4 w-4 rounded border-[#4b5563] bg-[#0f1419] text-[#c5bdb1] focus:ring-[#c5bdb1]" />
                Lembrar-me
            </label>
            <a href="#" class="text-[#c5bdb1] hover:text-white">Esqueci a senha</a>
        </div>

        <button type="submit" class="w-full rounded-2xl bg-[#c5bdb1] px-4 py-3 text-sm font-semibold text-[#1a1d26] transition hover:bg-[#d4c9bd]">
            Entrar
        </button>
        <div class="border border-white/10 bg-white/5 backdrop-blur-x1 w-14 h-14 flex items-center justify-center mx-auto">
            <div class="g-signin2" data-width="56" data-height="56" data-longtitle="false" data-theme="dark"></div>
        </div>

    </form>

    <p class="mt-6 text-center text-sm text-[#9ca3af]">
        Ainda não tem conta? <a href="/pages/cadastro.html" class="font-semibold text-[#c5bdb1] hover:text-white">Criar agora</a>
    </p>
</div>
