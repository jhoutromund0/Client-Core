<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitus – Cadastro de Cliente</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-[#1a1c1a] text-[#f0f0f0] font-sans">
  <div id="monitus-nav-slot"></div>

  <main class="min-h-[calc(100vh-64px)] flex items-center justify-center px-6 py-16">
    <section class="w-full max-w-4xl rounded-[2rem] border border-[#3eb449]/15 bg-[#141716]/85 p-8 shadow-[0_40px_120px_rgba(0,0,0,0.35)] backdrop-blur-xl">
      <div class="mb-10 text-center">
        <h1 class="mt-4 text-4xl font-extrabold text-[#7cf887] sm:text-5xl">Cadastro de Cliente</h1>
        <p class="mt-3 max-w-2xl mx-auto text-[#c5bdb1]/80">Preencha os dados abaixo para cadastrar um cliente com segurança e clareza.</p>
      </div>

      <form class="grid gap-6" autocomplete="off">
        <div class="grid gap-6 sm:grid-cols-2">
          <label class="space-y-2 text-sm text-[#c5bdb1]/90">
            <span class="font-medium text-[#f8faf7]">CNPJ</span>
            <input id="cnpj" type="text" placeholder="00.000.000/0000-00" class="w-full rounded-3xl border border-[#3eb449]/20 bg-[#111314] px-5 py-4 text-sm text-white outline-none transition focus:border-[#3eb449] focus:ring-2 focus:ring-[#3eb449]/20" />
            <p id="cnpj-status" class="text-xs text-[#c5bdb1]/70 min-h-[1.25rem]">Digite o CNPJ para buscar automaticamente.</p>
          </label>

          <label class="space-y-2 text-sm text-[#c5bdb1]/90">
            <span class="font-medium text-[#f8faf7]">Indicador Matriz/Filial</span>
            <select id="indicador" class="w-full rounded-3xl border border-[#3eb449]/20 bg-[#111314] px-5 py-4 text-sm text-white outline-none transition focus:border-[#3eb449] focus:ring-2 focus:ring-[#3eb449]/20">
              <option value="matriz">Matriz</option>
              <option value="filial">Filial</option>
            </select>
          </label>
        </div>

        <label class="space-y-2 text-sm text-[#c5bdb1]/90">
          <span class="font-medium text-[#f8faf7]">Nome Empresarial</span>
          <input id="nome-empresarial" type="text" placeholder="Nome da empresa" class="w-full rounded-3xl border border-[#3eb449]/20 bg-[#111314] px-5 py-4 text-sm text-white outline-none transition focus:border-[#3eb449] focus:ring-2 focus:ring-[#3eb449]/20" />
        </label>

        <div class="grid gap-6 sm:grid-cols-2">
          <label class="space-y-2 text-sm text-[#c5bdb1]/90">
            <span class="font-medium text-[#f8faf7]">Telefone</span>
            <input id="telefone" type="tel" placeholder="(00) 00000-0000" class="w-full rounded-3xl border border-[#3eb449]/20 bg-[#111314] px-5 py-4 text-sm text-white outline-none transition focus:border-[#3eb449] focus:ring-2 focus:ring-[#3eb449]/20" />
          </label>

          <label class="space-y-2 text-sm text-[#c5bdb1]/90">
            <span class="font-medium text-[#f8faf7]">Email</span>
            <input id="email" type="email" placeholder="contato@empresa.com" class="w-full rounded-3xl border border-[#3eb449]/20 bg-[#111314] px-5 py-4 text-sm text-white outline-none transition focus:border-[#3eb449] focus:ring-2 focus:ring-[#3eb449]/20" />
          </label>
        </div>

        <label class="space-y-2 text-sm text-[#c5bdb1]/90">
          <span class="font-medium text-[#f8faf7]">Endereço</span>
          <input id="endereco" type="text" placeholder="Rua, número, bairro, cidade" class="w-full rounded-3xl border border-[#3eb449]/20 bg-[#111314] px-5 py-4 text-sm text-white outline-none transition focus:border-[#3eb449] focus:ring-2 focus:ring-[#3eb449]/20" />
        </label>

        <div class="grid gap-6 sm:grid-cols-2">
          <label class="space-y-2 text-sm text-[#c5bdb1]/90">
            <span class="font-medium text-[#f8faf7]">Referência</span>
            <input id="referencia" type="text" placeholder="Perto de..." class="w-full rounded-3xl border border-[#3eb449]/20 bg-[#111314] px-5 py-4 text-sm text-white outline-none transition focus:border-[#3eb449] focus:ring-2 focus:ring-[#3eb449]/20" />
          </label>

          <label class="space-y-2 text-sm text-[#c5bdb1]/90">
            <span class="font-medium text-[#f8faf7]">Complemento</span>
            <input id="complemento" type="text" placeholder="Sala, bloco, complemento" class="w-full rounded-3xl border border-[#3eb449]/20 bg-[#111314] px-5 py-4 text-sm text-white outline-none transition focus:border-[#3eb449] focus:ring-2 focus:ring-[#3eb449]/20" />
          </label>
        </div>

        <div class="mt-6 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
          <p class="text-sm text-[#c5bdb1]/70">* Campos obrigatórios para cadastro de cliente.</p>
          <button type="submit" class="inline-flex items-center justify-center rounded-3xl bg-[#3eb449] px-6 py-4 text-sm font-semibold text-[#0f1419] transition hover:bg-[#62d06d]">Cadastrar Cliente</button>
        </div>
      </form>
    </section>
  </main>
  <script type="module" src="./scripts/cadastrar.js"></script>
  <script>
    fetch('/components/monitus-nav.html')
      .then(resp => {
        if (!resp.ok) throw new Error('Monitus nav não encontrado');
        return resp.text();
      })
      .then(html => { document.getElementById('monitus-nav-slot').innerHTML = html; })
      .catch(err => console.error('Erro ao carregar monitus-nav:', err));
  </script>
  
</body>
</html>
