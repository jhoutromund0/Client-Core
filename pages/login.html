<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-signin-client_id" content="YOUR_CLIENT_ID.apps.googleusercontent.com">
    <title>Cliente Core - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://apis.google.com/js/platform.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        :root {
            --color-gold: #c5bdb1;
            --color-dark: #1a1d26;
            --color-darker: #0f1419;
            --color-gray-600: #4b5563;
            --color-gray-500: #6b7280;
            --color-gray-400: #9ca3af;
        }
    </style>
</head>
<body class="min-h-screen bg-[#1a1d26] text-white antialiased">
    <div id="page-header"></div>

    <div class="flex min-h-screen items-center justify-center px-4 py-12 pt-28">
        <div class="w-full max-w-md rounded-[2rem] border border-white/10 bg-[#0f1419]/95 p-10 shadow-[0_25px_100px_rgba(0,0,0,0.25)] backdrop-blur-2xl">
            <div class="mb-8 text-center">
                <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-3xl border border-[#c5bdb1]/30 bg-[#c5bdb1]/10 text-2xl font-bold text-[#c5bdb1]">
                    C
                </div>
                <h1 class="text-3xl font-semibold text-white">Bem-vindo de volta</h1>
                <p class="mt-2 text-sm text-[#9ca3af]">Faça login para acessar o painel do Cliente Core.</p>
            </div>

            <form class="space-y-6">  
                <div>
                    <label class="mb-2 block text-sm font-medium text-[#d1d5db]">E-mail</label>
                    <input type="email" placeholder="seu@email.com"
                        class="w-full rounded-2xl border border-[#333847] bg-[#121827] px-4 py-3 text-sm text-white outline-none transition focus:border-[#c5bdb1] focus:ring-2 focus:ring-[#c5bdb1]/20" />
                </div>

                <div>
                    <label class="mb-2 block text-sm font-medium text-[#d1d5db]">Senha</label>
                    <input type="password" placeholder="••••••••"
                        class="w-full rounded-2xl border border-[#333847] bg-[#121827] px-4 py-3 text-sm text-white outline-none transition focus:border-[#c5bdb1] focus:ring-2 focus:ring-[#c5bdb1]/20" />
                </div>

                <div class="flex items-center justify-between text-sm text-[#9ca3af]">
                    <label class="flex items-center gap-2">
                        <input type="checkbox" class="h-4 w-4 rounded border-[#4b5563] bg-[#0f1419] text-[#c5bdb1] focus:ring-[#c5bdb1]" />
                        Lembrar-me
                    </label>
                    <a href="#" class="text-[#c5bdb1] hover:text-white">Esqueci a senha</a>
                </div>

                <button type="submit" class="w-full rounded-2xl bg-[#c5bdb1] px-4 py-3 text-sm font-semibold text-[#1a1d26] transition hover:bg-[#d4c9bd]">
                    Entrar
                </button>
                <div class="border border-white/10 bg-white/5 backdrop-blur-x1 w-14 h-14 flex items-center justify-center mx-auto">
                    <div class="g-signin2" data-width="56" data-height="56" data-longtitle="false" data-theme="dark"></div>
                </div>

            </form>

            <p class="mt-6 text-center text-sm text-[#9ca3af]">
                Ainda não tem conta? <a href="home.html" class="font-semibold text-[#c5bdb1] hover:text-white">Criar agora</a>
            </p>
        </div>
    </div>
</body>
</html>
